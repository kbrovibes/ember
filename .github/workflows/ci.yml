name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Test
        run: scripts/test.sh
      - name: Build DMG
        run: UNIVERSAL=1 scripts/dmg.sh
      - name: Keep the build
        uses: actions/upload-artifact@v4
        with:
          name: Ember-dev-dmg
          path: build/Ember.dmg
          retention-days: 14
